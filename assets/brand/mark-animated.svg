<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 134 23" role="img" aria-labelledby="t">
<style>
.lg-box, .lg-line path, .lg-word path { transform-box: fill-box; }
.lg-box { transform-origin: 50% 100%; animation: lg-stamp 300ms 120ms backwards; }
.lg-run1 { transform-origin: 0 50%; animation: lg-draw-x 200ms cubic-bezier(.45,0,.55,1) 200ms backwards; }
.lg-step { transform-origin: 0 100%; animation: lg-draw-xy 50ms cubic-bezier(.4,0,1,1) 400ms backwards; }
.lg-run2 { transform-origin: 0 50%; animation: lg-draw-x 70ms cubic-bezier(0,0,.2,1) 450ms backwards; }
.lg-g1 { animation: lg-rise 340ms cubic-bezier(.16,1,.3,1) 240ms backwards; }
.lg-g2 { animation: lg-rise 340ms cubic-bezier(.16,1,.3,1) 262ms backwards; }
.lg-g3 { animation: lg-rise 340ms cubic-bezier(.16,1,.3,1) 282ms backwards; }
.lg-g4 { animation: lg-rise 340ms cubic-bezier(.16,1,.3,1) 302ms backwards; }
.lg-g5 { animation: lg-rise 340ms cubic-bezier(.16,1,.3,1) 322ms backwards; }
@keyframes lg-stamp {
  0%   { opacity: 0; transform: scale(1.14); animation-timing-function: cubic-bezier(.55,0,.9,.45); }
  20%  { opacity: 1; }
  55%  { opacity: 1; transform: scale(.975); animation-timing-function: cubic-bezier(.2,0,.2,1); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes lg-draw-x  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes lg-draw-xy { from { transform: scale(0); }  to { transform: scale(1); } }
@keyframes lg-rise    { from { transform: translateY(24px); } to { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .lg-box, .lg-line path, .lg-word path { animation: none !important; } }
</style>
<title id="t">巣立ちマップ</title>
<desc>launch animation of the lockup (MOTION-SPEC §2.3 slot): the 巣 box stamps onto the line, the line leaves the box and steps up, 立ちマップ rises from behind the line. Same paths and classes as SM.brand.lockup({line:true}). Static under reduced motion.</desc>
